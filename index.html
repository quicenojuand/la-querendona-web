<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>La Querendona Foods | Reconstruyendo el Sabor</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts: Cormorant Garamond, Inter, JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,400&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet" />

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            serif: ['"Cormorant Garamond"', 'serif'],
            sans: ['"Inter"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          }
        }
      }
    };
  </script>
</head>
<body class="bg-black text-white font-sans antialiased overflow-hidden select-none">

  <!-- PORTADA PRINCIPAL EN NEGRO ABSOLUTO -->
  <main class="relative min-h-screen w-full bg-black flex flex-col items-center justify-center overflow-hidden px-6">

    <!-- Logotipo La Querendona en Dorado Luminoso -->
    <div class="relative z-20 flex flex-col items-center text-center">
      <span class="font-mono text-[10px] md:text-xs uppercase tracking-[0.45em] text-[#D4AF37]/85 mb-3">
        Reconstruyendo el Sabor
      </span>
      <h1 class="font-serif text-5xl sm:text-7xl lg:text-8xl font-bold tracking-tight text-center bg-clip-text text-transparent bg-gradient-to-b from-[#FFF8DC] via-[#D4AF37] to-[#9A7418] drop-shadow-[0_0_35px_rgba(212,175,55,0.55)]">
        La Querendona
      </h1>
    </div>

    <!-- Efecto Aceternity Sparkles (Haces de Luz + Partículas Doradas) -->
    <div class="w-full max-w-[42rem] h-36 relative mt-3">
      <!-- Gradients Superiores en Oro Luminoso -->
      <div class="absolute inset-x-16 top-0 bg-gradient-to-r from-transparent via-[#D4AF37] to-transparent h-[2px] w-3/4 mx-auto blur-sm"></div>
      <div class="absolute inset-x-16 top-0 bg-gradient-to-r from-transparent via-[#FFF8DC] to-transparent h-px w-3/4 mx-auto"></div>
      <div class="absolute inset-x-48 top-0 bg-gradient-to-r from-transparent via-[#F5D061] to-transparent h-[5px] w-1/4 mx-auto blur-sm"></div>
      <div class="absolute inset-x-48 top-0 bg-gradient-to-r from-transparent via-[#FFF8DC] to-transparent h-px w-1/4 mx-auto"></div>

      <!-- Lienzo de Partículas -->
      <canvas id="sparkles-canvas" class="w-full h-full block opacity-0 transition-opacity duration-1000"></canvas>

      <!-- Máscara Radial Negra para fundir bordes -->
      <div class="pointer-events-none absolute inset-0 w-full h-full bg-black [mask-image:radial-gradient(350px_200px_at_top,transparent_20%,white)]"></div>
    </div>

    <!-- Dos Botones Blancos Minimalistas -->
    <div class="relative z-20 mt-4 flex flex-col sm:flex-row items-center justify-center gap-6 w-full max-w-xl">

      <!-- Botón 1: Clientes Corporativos (Abre corporativos.html) -->
      <a
        href="./corporativos.html"
        class="w-full sm:w-64 py-4 px-8 rounded-full bg-white text-black font-sans font-semibold text-xs md:text-sm uppercase tracking-[0.18em] text-center transition-all duration-300 ease-out hover:scale-110 hover:-translate-y-2 hover:shadow-[0_0_45px_rgba(255,255,255,0.85)] active:scale-100 cursor-pointer block"
      >
        Clientes Corporativos
      </a>

      <!-- Botón 2: Unidades (Sobresale igual en hover, sin acceso por ahora) -->
      <button
        type="button"
        onclick="lockedUnidadesNotice(this)"
        class="w-full sm:w-64 py-4 px-8 rounded-full bg-white text-black font-sans font-semibold text-xs md:text-sm uppercase tracking-[0.18em] text-center transition-all duration-300 ease-out hover:scale-110 hover:-translate-y-2 hover:shadow-[0_0_45px_rgba(255,255,255,0.85)] active:scale-100 cursor-not-allowed"
      >
        <span id="unidades-btn-text">Unidades</span>
      </button>

    </div>

  </main>

  <!-- Motor Sparkles Core + Control del Botón Unidades -->
  <script>
    function lockedUnidadesNotice(button) {
      const label = button.querySelector("#unidades-btn-text");
      if (!label) return;
      label.textContent = "Próximamente";
      setTimeout(() => {
        label.textContent = "Unidades";
      }, 1600);
    }

    (function initSparkles() {
      const canvas = document.getElementById("sparkles-canvas");
      if (!canvas) return;
      const ctx = canvas.getContext("2d");
      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      let width, height, particles = [];
      const palette = ["#FFF8DC", "#D4AF37", "#F5D061", "#FFFFFF"];

      function resize() {
        const rect = canvas.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;
        width = rect.width;
        height = rect.height;
        canvas.width = width * dpr;
        canvas.height = height * dpr;
        ctx.scale(dpr, dpr);
      }

      function createParticles() {
        particles = [];
        for (let i = 0; i < 130; i++) {
          particles.push({
            x: Math.random() * width,
            y: Math.random() * height,
            size: Math.random() * (1.2 - 0.4) + 0.4,
            speedX: (Math.random() - 0.5) * 0.35,
            speedY: (Math.random() - 0.5) * 0.35,
            opacity: Math.random(),
            opacitySpeed: (Math.random() * 0.018 + 0.005) * (Math.random() < 0.5 ? 1 : -1),
            color: palette[Math.floor(Math.random() * palette.length)]
          });
        }
      }

      function render() {
        ctx.clearRect(0, 0, width, height);
        for (const p of particles) {
          if (!reduceMotion) {
            p.x += p.speedX;
            p.y += p.speedY;
            p.opacity += p.opacitySpeed;
            if (p.opacity <= 0.1 || p.opacity >= 1) p.opacitySpeed *= -1;
            if (p.x < 0) p.x = width;
            if (p.x > width) p.x = 0;
            if (p.y < 0) p.y = height;
            if (p.y > height) p.y = 0;
          }
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fillStyle = p.color;
          ctx.globalAlpha = Math.max(0.1, Math.min(1, p.opacity));
          ctx.fill();
        }
        if (!reduceMotion) requestAnimationFrame(render);
      }

      resize();
      createParticles();
      render();
      requestAnimationFrame(() => canvas.classList.remove("opacity-0"));
      window.addEventListener("resize", () => {
        resize();
        createParticles();
      });
    })();
  </script>
</body>
</html>
