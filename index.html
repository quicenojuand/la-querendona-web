<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>La Querendona Foods | Reconstruyendo el Sabor</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts: Cormorant Garamond + Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,600;1,700&family=Inter:wght@500;600;700&display=swap" rel="stylesheet" />

  <style>
    body {
      background-color: #000000;
      font-family: 'Inter', sans-serif;
    }

    /* Ocultar controles nativos de video */
    video::-webkit-media-controls {
      display: none !important;
      -webkit-appearance: none !important;
    }

    /* Video maximizado (protagonista absoluto de la pantalla) y fundido perfecto */
    .flow-video-seamless {
      mix-blend-mode: lighten;
      filter: contrast(1.16) brightness(0.96);
      -webkit-mask-image: radial-gradient(ellipse 65% 90% at 50% 35%, #000 65%, transparent 99%);
      mask-image: radial-gradient(ellipse 65% 90% at 50% 35%, #000 65%, transparent 99%);
    }

    @media (max-width: 640px) {
      .flow-video-seamless {
        -webkit-mask-image: radial-gradient(ellipse 90% 90% at 50% 36%, #000 72%, transparent 99%);
        mask-image: radial-gradient(ellipse 90% 90% at 50% 36%, #000 72%, transparent 99%);
      }
    }

    /* Barrido de izquierda a derecha para "HECHO CON AMOR" (tamaño sutil, elegante y proporcionado) */
    @keyframes sweepLeftToRight {
      0% {
        clip-path: inset(0 100% 0 0);
        opacity: 0;
        transform: translateX(-10px);
      }
      20% {
        opacity: 1;
      }
      100% {
        clip-path: inset(0 0% 0 0);
        opacity: 1;
        transform: translateX(0);
      }
    }

    @keyframes goldLightShimmer {
      0% {
        background-position: -200% center;
      }
      100% {
        background-position: 200% center;
      }
    }

    .hecho-con-amor-reveal {
      font-family: 'Cormorant Garamond', serif;
      background: linear-gradient(
        90deg,
        #C5A059 0%,
        #D4AF37 25%,
        #FFFDF0 50%,
        #D4AF37 75%,
        #C5A059 100%
      );
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 0 15px rgba(212, 175, 55, 0.45));
      opacity: 0;
    }

    .hecho-con-amor-active {
      animation:
        sweepLeftToRight 1.5s cubic-bezier(0.22, 1, 0.36, 1) forwards,
        goldLightShimmer 4.5s linear 1.5s infinite;
    }
  </style>
</head>
<body class="bg-black text-white antialiased overflow-hidden select-none">

  <!-- PORTADA PRINCIPAL -->
  <main class="relative h-[100dvh] w-full bg-black flex flex-col items-center justify-between pb-6 sm:pb-8 pt-0 overflow-hidden px-4">

    <!-- 1. Contenedor Superior: Video Maximizado + Frase "HECHO CON AMOR" (proporcionada) -->
    <div class="relative z-20 w-full max-w-5xl flex flex-col items-center justify-start pointer-events-none">
      
      <!-- Video con mayor protagonismo (100dvh en desktop, 80dvh en móvil) -->
      <video
        id="querendona-intro-video"
        src="./logo-intro.mp4"
        poster="./logo-dorado.jpg"
        autoplay
        muted
        playsinline
        webkit-playsinline="true"
        preload="auto"
        disablePictureInPicture
        class="flow-video-seamless w-full h-[66dvh] sm:h-[74dvh] object-contain object-top -mb-4 sm:-mb-6"
      ></video>

      <!-- Frase en MAYÚSCULAS, cursiva elegante pero con tamaño discreto y armónico -->
      <div class="relative z-30 text-center">
        <p id="hecho-con-amor-text" class="hecho-con-amor-reveal italic font-semibold text-lg sm:text-xl md:text-2xl tracking-[0.12em] uppercase">
          Hecho con amor
        </p>
      </div>

    </div>

    <!-- 2. Haz de Luz Dorado y Partículas -->
    <div id="sparkles-stage" class="w-full max-w-[50rem] h-12 sm:h-14 relative z-10 opacity-0 transition-opacity duration-1000">
      <div class="absolute inset-x-6 top-0 bg-gradient-to-r from-transparent via-[#D4AF37] to-transparent h-[2px] w-11/12 mx-auto blur-sm opacity-90"></div>
      <div class="absolute inset-x-6 top-0 bg-gradient-to-r from-transparent via-[#FFF8DC] to-transparent h-px w-11/12 mx-auto"></div>
      <div class="absolute inset-x-20 top-0 bg-gradient-to-r from-transparent via-[#F5D061] to-transparent h-[3px] w-2/3 mx-auto blur-sm opacity-80"></div>
      <div class="absolute inset-x-20 top-0 bg-gradient-to-r from-transparent via-[#FFF8DC] to-transparent h-px w-2/3 mx-auto"></div>

      <canvas id="sparkles-canvas" class="w-full h-full block"></canvas>

      <!-- Máscara Radial -->
      <div class="pointer-events-none absolute inset-0 w-full h-full bg-black [mask-image:radial-gradient(500px_70px_at_top,transparent_10%,white)]"></div>
    </div>

    <!-- 3. Dos Botones Blancos Gemelos 3D -->
    <div id="gateway-buttons" class="relative z-30 flex flex-col sm:flex-row items-center justify-center gap-3 sm:gap-6 w-full max-w-xl opacity-0 translate-y-2 transition-all duration-700">

      <!-- Botón 1: Clientes Corporativos -->
      <a
        href="./corporativos.html"
        class="w-56 h-11 px-6 rounded-full bg-gradient-to-b from-white via-neutral-100 to-neutral-300 text-black font-semibold text-[11px] uppercase tracking-[0.14em] whitespace-nowrap flex items-center justify-center border-b-[3px] border-neutral-400 shadow-[0_8px_20px_rgba(0,0,0,0.9),inset_0_1px_1px_rgba(255,255,255,1)] hover:scale-105 hover:-translate-y-0.5 hover:shadow-[0_0_28px_rgba(255,255,255,0.65)] active:border-b-0 active:translate-y-0.5 transition-all duration-200 ease-out cursor-pointer"
      >
        Clientes Corporativos
      </a>

      <!-- Botón 2: Unidades -->
      <button
        type="button"
        onclick="lockedUnidadesNotice(this)"
        class="w-56 h-11 px-6 rounded-full bg-gradient-to-b from-white via-neutral-100 to-neutral-300 text-black font-semibold text-[11px] uppercase tracking-[0.14em] whitespace-nowrap flex items-center justify-center border-b-[3px] border-neutral-400 shadow-[0_8px_20px_rgba(0,0,0,0.9),inset_0_1px_1px_rgba(255,255,255,1)] hover:scale-105 hover:-translate-y-0.5 hover:shadow-[0_0_28px_rgba(255,255,255,0.65)] active:border-b-0 active:translate-y-0.5 transition-all duration-200 ease-out cursor-not-allowed"
      >
        <span id="unidades-btn-text">Unidades</span>
      </button>

    </div>

  </main>

  <!-- Script de Sincronización y Partículas -->
  <script>
    function lockedUnidadesNotice(button) {
      const label = button.querySelector("#unidades-btn-text");
      if (!label) return;
      label.textContent = "Próximamente";
      setTimeout(() => {
        label.textContent = "Unidades";
      }, 1600);
    }

    (function syncAndForcePlay() {
      const video = document.getElementById("querendona-intro-video");
      const phrase = document.getElementById("hecho-con-amor-text");
      const sparklesStage = document.getElementById("sparkles-stage");
      const buttons = document.getElementById("gateway-buttons");

      let stageTriggered = false;
      let phraseTriggered = false;

      function triggerStageAndButtons() {
        if (stageTriggered) return;
        stageTriggered = true;
        sparklesStage.classList.remove("opacity-0");
        buttons.classList.remove("opacity-0", "translate-y-2");
      }

      function triggerPhrase() {
        if (phraseTriggered) return;
        phraseTriggered = true;
        phrase.classList.add("hecho-con-amor-active");
      }

      if (!video) return;

      video.defaultMuted = true;
      video.muted = true;
      video.playsInline = true;

      function attemptAutoPlay() {
        const playPromise = video.play();
        if (playPromise !== undefined) {
          playPromise.catch(() => {
            video.currentTime = 7.0;
            triggerStageAndButtons();
            triggerPhrase();
          });
        }
      }

      if (video.readyState >= 2) {
        attemptAutoPlay();
      } else {
        video.addEventListener("loadeddata", attemptAutoPlay, { once: true });
      }

      const unlockOnTouch = () => {
        if (video.paused && video.currentTime >= 6.8) {
          video.currentTime = 0;
          video.play().catch(() => {});
        } else if (video.paused) {
          video.play().catch(() => {});
        }
        window.removeEventListener("touchstart", unlockOnTouch);
        window.removeEventListener("click", unlockOnTouch);
      };
      window.addEventListener("touchstart", unlockOnTouch, { passive: true });
      window.addEventListener("click", unlockOnTouch, { passive: true });

      video.addEventListener("timeupdate", () => {
        if (video.currentTime >= 2.2) triggerStageAndButtons();
        if (video.currentTime >= 5.5) triggerPhrase();
      });

      setTimeout(triggerStageAndButtons, 2300);
      setTimeout(triggerPhrase, 5400);
    })();

    // Motor Sparkles Core
    (function initSparkles() {
      const canvas = document.getElementById("sparkles-canvas");
      if (!canvas) return;
      const ctx = canvas.getContext("2d");
      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      let width, height, particles = [];
      const palette = ["#FFF8DC", "#D4AF37", "#F5D061", "#FFFFFF"];

      function resize() {
        const rect = canvas.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;
        width = rect.width;
        height = rect.height;
        canvas.width = width * dpr;
        canvas.height = height * dpr;
        ctx.scale(dpr, dpr);
      }

      function createParticles() {
        particles = [];
        for (let i = 0; i < 120; i++) {
          particles.push({
            x: Math.random() * width,
            y: Math.random() * height,
            size: Math.random() * (1.2 - 0.4) + 0.4,
            speedX: (Math.random() - 0.5) * 0.35,
            speedY: (Math.random() - 0.5) * 0.35,
            opacity: Math.random(),
            opacitySpeed: (Math.random() * 0.016 + 0.004) * (Math.random() < 0.5 ? 1 : -1),
            color: palette[Math.floor(Math.random() * palette.length)]
          });
        }
      }

      function render() {
        ctx.clearRect(0, 0, width, height);
        for (const p of particles) {
          if (!reduceMotion) {
            p.x += p.speedX;
            p.y += p.speedY;
            p.opacity += p.opacitySpeed;
            if (p.opacity <= 0.1 || p.opacity >= 1) p.opacitySpeed *= -1;
            if (p.x < 0) p.x = width;
            if (p.x > width) p.x = 0;
            if (p.y < 0) p.y = height;
            if (p.y > height) p.y = 0;
          }
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fillStyle = p.color;
          ctx.globalAlpha = Math.max(0.1, Math.min(1, p.opacity));
          ctx.fill();
        }
        if (!reduceMotion) requestAnimationFrame(render);
      }

      resize();
      createParticles();
      render();
      window.addEventListener("resize", () => {
        resize();
        createParticles();
      });
    })();
  </script>
</body>
</html>
