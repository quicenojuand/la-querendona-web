<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>La Querendona Foods | Reconstruyendo el Sabor</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap" rel="stylesheet" />

  <style>
    body {
      background-color: #000000;
      font-family: 'Inter', sans-serif;
    }
    /* Funde cualquier borde del archivo .jpg con el negro absoluto #000000 sin crear halos rectangulares */
    .seamless-jpg-logo {
      mix-blend-mode: lighten;
      filter: contrast(1.08) brightness(0.98);
      -webkit-mask-image: radial-gradient(ellipse 75% 88% at 50% 38%, #000 68%, transparent 100%);
      mask-image: radial-gradient(ellipse 75% 88% at 50% 38%, #000 68%, transparent 100%);
    }
  </style>
</head>
<body class="bg-black text-white antialiased overflow-hidden select-none">

  <!-- PORTADA PRINCIPAL EN NEGRO ABSOLUTO -->
  <main class="relative h-screen w-full bg-black flex flex-col items-center justify-between pb-14 pt-0 overflow-hidden px-6">

    <!-- 1. Logotipo Estático Anclado Arriba (Lee ./logo-dorado.jpg sin mostrar bordes) -->
    <div class="relative z-20 w-full max-w-2xl flex justify-center items-start pointer-events-none">
      <img
        src="./logo-dorado.jpg"
        alt="La Querendona - Reconstruyendo el Sabor"
        class="seamless-jpg-logo w-full max-h-[54vh] object-contain object-top"
      />
    </div>

    <!-- 2. Haz de Luz Dorado y Partículas Sutiles (Aceternity Sparkles) -->
    <div class="w-full max-w-[36rem] h-24 relative -mt-8 z-10">
      <div class="absolute inset-x-16 top-0 bg-gradient-to-r from-transparent via-[#D4AF37] to-transparent h-[2px] w-3/4 mx-auto blur-sm opacity-90"></div>
      <div class="absolute inset-x-16 top-0 bg-gradient-to-r from-transparent via-[#FFF8DC] to-transparent h-px w-3/4 mx-auto"></div>
      <div class="absolute inset-x-44 top-0 bg-gradient-to-r from-transparent via-[#F5D061] to-transparent h-[4px] w-1/4 mx-auto blur-sm opacity-80"></div>
      <div class="absolute inset-x-44 top-0 bg-gradient-to-r from-transparent via-[#FFF8DC] to-transparent h-px w-1/4 mx-auto"></div>

      <canvas id="sparkles-canvas" class="w-full h-full block"></canvas>

      <!-- Máscara Radial Negra para fundir el lienzo de partículas -->
      <div class="pointer-events-none absolute inset-0 w-full h-full bg-black [mask-image:radial-gradient(300px_130px_at_top,transparent_20%,white)]"></div>
    </div>

    <!-- 3. Dos Botones Blancos Gemelos (Mismo alto h-11, mismo ancho w-56 y 1 sola línea) -->
    <div class="relative z-30 flex flex-col sm:flex-row items-center justify-center gap-4 sm:gap-6 w-full max-w-xl">

      <!-- Botón 1: Clientes Corporativos -->
      <a
        href="./corporativos.html"
        class="w-56 h-11 px-6 rounded-full bg-gradient-to-b from-white via-neutral-100 to-neutral-300 text-black font-semibold text-[11px] uppercase tracking-[0.14em] whitespace-nowrap flex items-center justify-center border-b-[3px] border-neutral-400 shadow-[0_8px_20px_rgba(0,0,0,0.9),inset_0_1px_1px_rgba(255,255,255,1)] hover:scale-105 hover:-translate-y-0.5 hover:shadow-[0_0_28px_rgba(255,255,255,0.65)] active:border-b-0 active:translate-y-0.5 transition-all duration-200 ease-out cursor-pointer"
      >
        Clientes Corporativos
      </a>

      <!-- Botón 2: Unidades (Misma proporción exacta, bloqueado por ahora) -->
      <button
        type="button"
        onclick="lockedUnidadesNotice(this)"
        class="w-56 h-11 px-6 rounded-full bg-gradient-to-b from-white via-neutral-100 to-neutral-300 text-black font-semibold text-[11px] uppercase tracking-[0.14em] whitespace-nowrap flex items-center justify-center border-b-[3px] border-neutral-400 shado
